  <form id="loginForm" class="card login-card" autocomplete="off">

    <h1>Dhyan Surf</h1>
    <p class="muted">Safe browsing for study. New name? An account is created on this device.</p>
    <label for="uName">Student Name or School Name</label>
    <input id="uName" required maxlength="40" autocomplete="username">
    <label for="uPass">Password</label>
    <input id="uPass" type="password" required minlength="4" autocomplete="current-password">
    <p id="loginErr" class="err" role="alert"></p>
    <button class="btn primary" type="submit">Log in</button>
    <div id="profiles" class="profiles" aria-label="Profiles on this device"></div>
  </form>
</main>

<!-- APP -->
<div id="appView" hidden>
  <header class="top">
    <img src="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA1MTIgNTEyIj48cmVjdCB3aWR0aD0iNTEyIiBoZWlnaHQ9IjUxMiIgcng9IjExMiIgZmlsbD0iIzBiMTEyMCIvPjxwYXRoIGQ9Ik0yNTYgNjQgNDAwIDEyMHYxMThjMCA5Ni02MiAxNjgtMTQ0IDIxMEMxNzQgNDA2IDExMiAzMzQgMTEyIDIzOFYxMjB6IiBmaWxsPSIjMGYxYjMzIiBzdHJva2U9IiMzOGJkZjgiIHN0cm9rZS13aWR0aD0iMTYiIHN0cm9rZS1saW5lam9pbj0icm91bmQiLz48cGF0aCBkPSJNMTQ4IDI2MmMzNi01MiA2OC01MiAxMDggMHM3MiA1MiAxMDggMHYzNGMtMzYgNTItNzIgNTItMTA4IDBzLTcyLTUyLTEwOCAweiIgZmlsbD0iIzM4YmRmOCIvPjxwYXRoIGQ9Ik0xNDggMzIyYzM2LTQwIDY4LTQwIDEwOCAwczcyIDQwIDEwOCAwdjMwYy0zNiA0MC03MiA0MC0xMDggMHMtNzItNDAtMTA4IDB6IiBmaWxsPSIjMTBiOTgxIi8+PHBhdGggZD0iTTI1NiAxMDB2NDZNMjMyIDEyM2g0OCIgc3Ryb2tlPSIjMzhiZGY4IiBzdHJva2Utd2lkdGg9IjEwIiBzdHJva2UtbGluZWNhcD0icm91bmQiLz48L3N2Zz4=" alt="" width="32" height="32">
    <strong class="brand">Dhyan Surf</strong>
    <form id="searchForm" class="omni" role="search">
      <input id="q" type="text" placeholder="Search or type a website address" aria-label="Search or enter address" autocomplete="off" maxlength="200">
      <button class="btn primary" type="submit">Search</button>
    </form>
    <div class="pomo" aria-label="Pomodoro study timer">
      <span id="pomoMode">Focus</span>
      <time id="pomoTime">25:00</time>
      <button id="pomoGo" class="btn sm" title="Start or pause">▶</button>
      <button id="pomoReset" class="btn sm" title="Reset">↺</button>
      <button id="pomoSwap" class="btn sm" title="Switch focus/break">⇄</button>
    </div>
    <div class="user">
      <span id="whoami"></span>
      <button id="switchBtn" class="btn sm">Switch</button>
      <button id="logoutBtn" class="btn sm">Log out</button>
    </div>
  </header>
  <nav class="bookmarks" id="bookmarks" aria-label="Quick bookmarks"></nav>

  <main class="wrap">
    <div id="banner" class="banner" role="alert" hidden>🚫 Dhyan Shield: Restricted Content</div>

    <section id="home">
      <h2>Fact Adda E-Learning</h2>
      <div class="grid" id="factCards"></div>
    </section>

    <section id="results" hidden>
      <div class="rhead">
        <h2 id="rtitle"></h2>
        <a id="gsafe" class="btn primary" target="_blank" rel="noopener noreferrer">Open in Google SafeSearch</a>
      </div>
      <div id="rlist"></div>
    </section>

    <section class="card" id="histBox">
      <div class="rhead">
        <h2>Search history</h2>
        <div>
          <button id="unlockBtn" class="btn">🔒 Unlock History</button>
          <button id="lockBtn" class="btn" hidden>Lock</button>
          <button id="clearBtn" class="btn danger" hidden>Clear</button>
        </div>
      </div>
      <p id="histLocked" class="muted">History is locked. Enter your password to view it.</p>
      <ul id="histList" class="hist" hidden></ul>
    </section>
  </main>
</div>

<!-- PASSWORD PROMPT -->
<dialog id="pwDlg">
  <form id="pwForm" method="dialog" class="card">
    <h3 id="pwTitle">Enter your password</h3>
    <input id="pwInput" type="password" required autocomplete="current-password" aria-label="Password">
    <p id="pwErr" class="err" role="alert"></p>
    <div class="row"><button type="button" id="pwCancel" class="btn">Cancel</button><button class="btn primary" type="submit">Confirm</button></div>
  </form>
</dialog>
<script src="app.js"></script>
